name: Refresh game data

# Rebuilds index.html from current tarkov.dev data once a day and commits it if anything changed.
# GitHub Pages serves index.html from the main branch, so a commit here updates the live page.

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild from current data
        run: python tools/refresh.py
      - name: Commit if the page changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Refresh game data"
            git push
          fi
